name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host TLS test dependency
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update --error-on=any
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y libmbedtls-dev
          dpkg-query -W libmbedtls-dev
      - name: Run portable tests
        run: make -f Makefile.host test

  build-3dsx:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DSX
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSend3DS-3dsx
          path: LocalSend3DS.3dsx
