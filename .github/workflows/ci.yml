name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable tests
        run: make -f Makefile.host test

  build-3dsx:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DSX
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: LocalSend3DS-3dsx
          path: LocalSend3DS.3dsx
